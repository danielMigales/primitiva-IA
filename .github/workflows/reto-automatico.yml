name: Reto Predictor automatico
on:
  schedule:
    - cron: '0 10 * * 0,3,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reto-predictor
  cancel-in-progress: false
jobs:
  predecir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector de PDFs oficiales
        run: python -m pip install -r requirements.txt
      - name: Comprobar registro del Reto Predictor
        run: python -m unittest discover -s tests -v
      - name: Generar prediccion antes del sorteo
        run: python scripts/generar_reto.py
      - name: Guardar prediccion en GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/control-modelo.json data/modelo-adaptativo.json data/reto-predictor.json
          if ! git diff --cached --quiet; then
            git commit -m 'Registrar prediccion previa al sorteo'
            git push
          fi
