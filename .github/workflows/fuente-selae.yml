name: Comprobar fuente SELAE
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/comprobar_fuente_selae.py'
      - '.github/workflows/fuente-selae.yml'
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector de PDFs oficiales
        run: python -m pip install -r requirements.txt
      - name: Leer nota oficial y contrastar el último resultado
        run: python scripts/comprobar_fuente_selae.py
