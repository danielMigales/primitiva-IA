name: Comprobar app
on:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'data/reto-predictor.json'
      - 'data/sorteos.json'
      - 'tests/test_app.cjs'
      - '.github/workflows/comprobar-app.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'data/reto-predictor.json'
      - 'data/sorteos.json'
      - 'tests/test_app.cjs'
      - '.github/workflows/comprobar-app.yml'
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis y comportamiento
        run: |
          node --check app.js
          node --test tests/test_app.cjs
