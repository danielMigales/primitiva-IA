name: Comprobar app
on:
  push:
    paths:
      - 'app.js'
      - 'live-results.js'
      - 'results-config.js'
      - 'api/**'
      - 'tests/test_live_results.cjs'
      - 'tests/test_pdf_results.cjs'
      - 'tests/test_rss_results.cjs'
      - 'index.html'
      - 'data/reto-predictor.json'
      - 'data/sorteos.json'
      - 'tests/test_app.cjs'
      - 'tests/test_reto.py'
      - 'tests/test_modelo_adaptativo.py'
      - 'tests/test_control_modelo.py'
      - 'tests/test_calidad_datos.py'
      - 'tests/test_analizar_patrones.py'
      - 'data/analisis-patrones.json'
      - 'data/validacion-patrones.jsonl'
      - 'data/calidad-datos.json'
      - 'data/control-modelo.json'
      - 'data/reto-estrategia-v3.json'
      - 'data/modelo-adaptativo.json'
      - 'data/reto-estrategia-v2.json'
      - 'tests/test_update_data.py'
      - 'tests/test_auditar_historico.py'
      - 'tests/test_evaluar_metodos.py'
      - 'data/evaluacion-metodos-config.json'
      - 'update_data.py'
      - 'requirements.txt'
      - 'data/verificacion-sorteos.json'
      - 'data/estado-actualizacion.json'
      - '.github/workflows/actualizar.yml'
      - 'scripts/**'
      - 'data/reto-estrategia-activa.json'
      - '.github/workflows/comprobar-app.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'live-results.js'
      - 'results-config.js'
      - 'api/**'
      - 'tests/test_live_results.cjs'
      - 'tests/test_pdf_results.cjs'
      - 'tests/test_rss_results.cjs'
      - 'index.html'
      - 'data/reto-predictor.json'
      - 'data/sorteos.json'
      - 'tests/test_app.cjs'
      - 'tests/test_reto.py'
      - 'tests/test_modelo_adaptativo.py'
      - 'tests/test_control_modelo.py'
      - 'tests/test_calidad_datos.py'
      - 'tests/test_analizar_patrones.py'
      - 'data/analisis-patrones.json'
      - 'data/validacion-patrones.jsonl'
      - 'data/calidad-datos.json'
      - 'data/control-modelo.json'
      - 'data/reto-estrategia-v3.json'
      - 'data/modelo-adaptativo.json'
      - 'data/reto-estrategia-v2.json'
      - 'tests/test_update_data.py'
      - 'tests/test_auditar_historico.py'
      - 'tests/test_evaluar_metodos.py'
      - 'data/evaluacion-metodos-config.json'
      - 'update_data.py'
      - 'requirements.txt'
      - 'data/verificacion-sorteos.json'
      - 'data/estado-actualizacion.json'
      - '.github/workflows/actualizar.yml'
      - 'scripts/**'
      - 'data/reto-estrategia-activa.json'
      - '.github/workflows/comprobar-app.yml'
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis y comportamiento
        run: |
          node --check app.js
          node --check live-results.js
          node --check api/resultados.mjs
          node --test tests/test_app.cjs tests/test_live_results.cjs tests/test_pdf_results.cjs tests/test_rss_results.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector de PDFs oficiales
        run: python -m pip install -r requirements.txt
      - name: Comprobar registro y estrategia activa
        run: python -m unittest discover -s tests -v
