name: Diagnosticar acceso SELAE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probar páginas oficiales sin cambiar datos
        run: python diagnostico_selae.py
