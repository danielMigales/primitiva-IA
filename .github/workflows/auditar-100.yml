name: Auditar 100 sorteos SELAE
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/auditar-100.yml'
permissions:
  contents: write
concurrency:
  group: auditar-historico-selae
  cancel-in-progress: false
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Comprobar auditoría antes de descargar
        run: python -m unittest discover -s tests -v
      - name: Cotejar 100 fechas pendientes con SELAE
        id: auditoria
        continue-on-error: true
        run: python scripts/auditar_historico.py --limit 100 --max-seconds 6600
      - name: Respaldar informe y cotejos antes de publicar
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-100
          path: |
            data/auditoria-historico.json
            data/verificacion-sorteos.json
      - name: Guardar informe y cotejos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/auditoria-historico.json data/verificacion-sorteos.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Auditar lote de 100 sorteos SELAE'
          for intento in 1 2 3; do
            if git push; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Señalar discrepancia o error de fuente
        if: steps.auditoria.outcome == 'failure'
        run: exit 1
