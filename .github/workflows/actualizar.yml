name: Actualizar sorteos

on:
  schedule:
    # Después del sorteo: lunes, jueves y sábado a las 22:15 en España peninsular.
    - cron: '15 22 * * 1,4,6'
      timezone: 'Europe/Madrid'
  push:
    paths:
      - '.github/workflows/actualizar.yml'
      - 'update_data.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-sorteos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector de PDFs oficiales
        run: python -m pip install -r requirements.txt
      - name: Actualizar datos
        id: actualizar
        continue-on-error: true
        run: python update_data.py
      - name: Generar siguiente predicción con el histórico actualizado
        if: steps.actualizar.outcome == 'success'
        run: python scripts/generar_reto.py
      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/control-modelo.json data/modelo-adaptativo.json data/sorteos.json data/verificacion-sorteos.json data/estado-actualizacion.json data/reto-predictor.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar sorteos'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Señalar actualización detenida
        if: steps.actualizar.outcome == 'failure'
        run: exit 1
