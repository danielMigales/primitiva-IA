name: Actualizar sorteos

on:
  schedule:
    # Después del sorteo: lunes, jueves y sábado a las 22:15 en España peninsular.
    - cron: '15 22 * * 1,4,6'
      timezone: 'Europe/Madrid'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Instalar lector de PDFs oficiales
        run: python -m pip install -r requirements.txt
      - name: Actualizar datos
        id: actualizar
        continue-on-error: true
        run: python update_data.py
      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sorteos.json data/verificacion-sorteos.json data/estado-actualizacion.json
          git diff --cached --quiet || (git commit -m 'Actualizar sorteos' && git push)
      - name: Señalar actualización detenida
        if: steps.actualizar.outcome == 'failure'
        run: exit 1
