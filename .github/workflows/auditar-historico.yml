name: Auditar histórico SELAE
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/auditar-historico.yml'
permissions:
  contents: write
concurrency:
  group: auditar-historico-selae
  cancel-in-progress: false
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validar auditoría
        run: python -m unittest discover -s tests -v
      - name: Cotejar siguiente lote (5 al publicar, 50 en ejecuciones diarias/manuales)
        id: auditoria
        continue-on-error: true
        run: python scripts/auditar_historico.py --limit "${{ github.event_name == 'push' && '5' || '50' }}"
      - name: Guardar evidencia y progreso
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/auditoria-historico.json data/verificacion-sorteos.json
          git diff --cached --quiet || (git commit -m 'Avanzar auditoría oficial del histórico' && git push)
      - name: Señalar discrepancia o fuente no disponible
        if: steps.auditoria.outcome == 'failure'
        run: exit 1
