name: Auditar 200 sorteos SELAE
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/auditar-200.yml'
permissions:
  contents: write
concurrency:
  group: auditar-historico-selae
  cancel-in-progress: false
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Comprobar auditoría antes de descargar
        run: python -m unittest discover -s tests -v
      - name: Cotejar 200 fechas pendientes con SELAE
        id: auditoria
        continue-on-error: true
        run: python scripts/auditar_historico.py --limit 200 --max-seconds 6600
      - name: Guardar informe y cotejos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/auditoria-historico.json data/verificacion-sorteos.json
          git diff --cached --quiet || (git commit -m 'Auditar lote de 200 sorteos SELAE' && git push)
      - name: Señalar discrepancia o error de fuente
        if: steps.auditoria.outcome == 'failure'
        run: exit 1
